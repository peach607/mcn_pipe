<html lang="zh-CN">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'Noto Sans SC', 'sans-serif'] },
          colors: {
            brand: { 50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 900: '#1e3a8a' },
            surface: '#f4f6f9'
          },
          boxShadow: {
            card: '0 1px 2px rgba(0,0,0,0.04), 0 2px 8px rgba(0,0,0,0.02)',
            float: '0 8px 24px rgba(0,0,0,0.08)'
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', 'Noto Sans SC', sans-serif; background: #e8ecf3; }
    .chat-bubble { animation: fadeInUp 0.35s ease-out both; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .typing-dot { animation: typing 1.4s infinite ease-in-out both; }
    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes typing { 0%,80%,100%{transform:scale(0);opacity:.4} 40%{transform:scale(1);opacity:1} }
    .progress-pulse { animation: pulseBar 2s infinite; }
    @keyframes pulseBar { 0%{opacity:.7} 50%{opacity:1} 100%{opacity:.7} }
    .spin-slow { animation: spin 2.5s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .glass { background: rgba(255,255,255,0.95); backdrop-filter: blur(12px); }
    .nav-card { transition: all .18s ease; }
    .nav-card:hover, .nav-card.active { background: #eff6ff; color: #2563eb; box-shadow: 0 2px 8px rgba(37,99,235,0.08); }
    .msg-card { transition: all .2s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
    .msg-card:hover { transform: translateX(4px) translateY(-1px); background: #fff; box-shadow: 0 10px 28px rgba(0,0,0,0.07); border-color: #bfdbfe; }
    .msg-card.active { background: #fff; box-shadow: 0 8px 24px rgba(37,99,235,0.08); border-color: #3b82f6; }
    .task-subcard { transition: all .16s ease; }
    .task-subcard:hover { background: #f8fafc; transform: translateX(2px); }
    .task-subcard.active { background: #eff6ff; border-color: #bfdbfe; }
    .reveal-block { opacity: 0; transform: translateY(6px); transition: all .35s ease; }
    .reveal-block.visible { opacity: 1; transform: translateY(0); }
    .prompt-chip { transition: all .15s ease; }
    .prompt-chip:hover { transform: translateY(-1px); box-shadow: 0 3px 10px rgba(37,99,235,0.12); border-color: #93c5fd; }
    .prompt-chip:active { transform: translateY(0); }
    .schedule-tab { transition: all .15s ease; }
    .schedule-tab.active { background: #2563eb; color: #fff; box-shadow: 0 2px 6px rgba(37,99,235,0.2); }
    .weekday-pill { transition: all .15s ease; }
    .weekday-pill.active { background: #2563eb; color: #fff; border-color: #2563eb; }
    .avatar-menu { transform-origin: top left; transition: all .18s ease; }
    .avatar-menu.hidden { opacity: 0; transform: scale(0.95); pointer-events: none; }
    .avatar-menu.show { opacity: 1; transform: scale(1); pointer-events: auto; }
    /* 统一为 76px 蓝色窄侧栏 */
    #mainRail { width: 76px !important; align-items: center; background: linear-gradient(180deg,#123a70,#0f2f5f) !important; color: #fff; border-right: 0; }
    #accountBox { width: 100%; min-height: 78px; padding: 17px 0; justify-content: center; border-bottom: 0; }
    #accountBox .account-brand { width: 58px; height: 44px; border-radius: 10px; display: grid; place-items: center; align-content: center; gap: 1px; background: rgba(255,255,255,.12); box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }
    #accountBox .account-brand strong { color: #fff; font-size: 12px; line-height: 1; }
    #accountBox .account-brand span { color: #dbeafe; font-size: 9px; line-height: 1; }
    #mainRail > .px-3.py-3 { display: none; }
    #mainRail nav { width: 100%; padding: 0 !important; margin-top: 7px; }
    #mainRail .nav-card { min-height: 55px; padding: 7px 0 !important; border-radius: 0; flex-direction: column; justify-content: center; gap: 4px; color: #bfcee2; position: relative; }
    #mainRail .nav-card > div { flex-direction: column; gap: 4px; }
    #mainRail .nav-card span.text-sm { font-size: 11px; line-height: 1.1; }
    #mainRail .nav-card > span { display: none; }
    #mainRail .nav-card:hover, #mainRail .nav-card.active { background: rgba(96,165,250,.13); color: #fff; box-shadow: none; }
    #mainRail .nav-card.active::before { content:""; position:absolute; left:0; top:8px; bottom:8px; width:3px; border-radius:0 3px 3px 0; background:#60a5fa; }
    #mainRail > .p-3.border-t { display: none; }
    /* 恢复原参考页白色宽侧栏 */
    #mainRail { width: 220px !important; align-items: stretch; background: #fff !important; color: #334155; border-right: 1px solid #e2e8f0; }
    #accountBox { min-height: 72px; padding: 14px 16px; justify-content: flex-start; border-bottom: 1px solid #f1f5f9; }
    #accountBox .account-brand { width: auto; height: auto; border-radius: 0; display: flex; align-items: center; gap: 5px; background: none; box-shadow: none; }
    #accountBox .account-brand strong, #accountBox .account-brand span { color: #1e293b; font-size: 14px; line-height: 1; font-weight: 700; }
    #mainRail > .px-3.py-3 { display: block; }
    #mainRail nav { padding: 0 12px !important; margin-top: 0; }
    #mainRail .nav-card { min-height: auto; padding: 10px 12px !important; border-radius: 8px; flex-direction: row; justify-content: space-between; gap: 0; color: #64748b; }
    #mainRail .nav-card > div { flex-direction: row; gap: 10px; }
    #mainRail .nav-card span.text-sm { font-size: 14px; line-height: 1.25; }
    #mainRail .nav-card > span { display: inline-flex; }
    #mainRail .nav-card:hover, #mainRail .nav-card.active { background: #eff6ff; color: #2563eb; box-shadow: 0 2px 8px rgba(37,99,235,.08); }
    #mainRail .nav-card.active::before { display: none; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  </style>
  <link rel="stylesheet" href="mcn-sidebar.css?v=20260728-24">
  <script src="mcn-sidebar.js?v=20260728-19" defer></script>
</head>
<body class="h-screen w-screen overflow-hidden flex items-center justify-center p-4">

  <!-- 桌面窗口 -->

    <!-- 1. 最左侧功能区 -->
    <aside id="mainRail" class="mcn-sidebar w-[220px] bg-white flex flex-col border-r border-slate-200 shrink-0">

          <button class="w-full flex items-center gap-2.5 px-3 py-2 text-xs text-slate-700 hover:bg-slate-50 transition"><svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>通用设置</button>
          <button class="w-full flex items-center gap-2.5 px-3 py-2 text-xs text-slate-700 hover:bg-slate-50 transition"><svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>帮助与反馈</button>
          <button class="w-full flex items-center gap-2.5 px-3 py-2 text-xs text-slate-700 hover:bg-slate-50 transition"><svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>版本更新</button>
          <div class="border-t border-slate-50 mt-1"></div>
          <button class="w-full flex items-center gap-2.5 px-3 py-2 text-xs text-red-600 hover:bg-red-50 transition"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>退出登录</button>
        </div>
      </div>

      <!-- 搜索 -->
      <div id="searchWrap" style="padding:12px 12px 8px;position:relative;">
        <div style="display:flex;align-items:center;gap:0;position:relative;background:#f1f5f9;border-radius:8px;border:1px solid transparent;transition:all .15s;">
          <svg style="position:absolute;left:10px;width:16px;height:16px;color:#94a3b8;pointer-events:none;flex-shrink:0;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          <input id="globalSearch" type="text" placeholder="搜索应用、工作流、消息" autocomplete="off" aria-label="搜索应用、工作流、消息" style="width:100%;border:none;outline:none;background:transparent;padding:8px 32px 8px 34px;font-size:12px;color:#334155;line-height:1.4;" />
          <button id="searchClear" class="hidden" aria-label="清除搜索" style="position:absolute;right:6px;padding:4px;color:#94a3b8;cursor:pointer;background:none;border:none;display:flex;align-items:center;"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="12" height="12"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
        </div>
        <div id="searchResults" class="hidden" style="position:absolute;left:12px;right:12px;top:100%;margin-top:4px;background:#fff;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.1),0 1px 3px rgba(0,0,0,.06);border:1px solid #e2e8f0;z-index:50;max-height:288px;overflow-y:auto;padding:4px 0;"></div>
      </div>

      <!-- Tab 导航 -->
      <nav class="mcn-nav flex-1 overflow-y-auto">
        <button class="mcn-nav-item cursor-pointer" onclick="location.href='index.html'"><svg class="mcn-nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg><span class="mcn-nav-label">首页</span></button>
        <button class="mcn-nav-item cursor-pointer" onclick="location.href='content-workbench.html'"><svg class="mcn-nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg><span class="mcn-nav-label">内容创作</span><span class="mcn-nav-badge">4</span></button>
        <button class="mcn-nav-item cursor-pointer" onclick="location.href='lead-insights.html'"><svg class="mcn-nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg><span class="mcn-nav-label">线索洞察</span><span class="mcn-nav-badge">2</span></button>
        <button class="mcn-nav-item cursor-pointer" onclick="location.href='http://stable-mncou8kdwb7xte0s-sandbox-preview.fe.htsc/'"><svg class="mcn-nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg><span class="mcn-nav-label">客户问答</span><span class="mcn-nav-badge">3</span></button>
        <button class="mcn-nav-item active cursor-pointer"><svg class="mcn-nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg><span class="mcn-nav-label">运营复盘</span><span id="tabReviewBadge" class="mcn-nav-badge">5</span></button>
        <button class="mcn-nav-item mcn-workbench-toggle cursor-pointer" type="button"><span class="mcn-nav-icon mcn-grid-icon"><i></i><i></i><i></i><i></i></span><span class="mcn-nav-label">业务平台</span></button>
        <button class="mcn-nav-item cursor-pointer" type="button" onclick="location.href='http://stable-8kbc7hhm4urfkvt6-sandbox-preview.fe.htsc/'"><span class="mcn-nav-icon">⚙</span><span class="mcn-nav-label">SOP 管理</span></button>
      </nav>

      <div class="mcn-account"><div class="mcn-account-avatar"><img src="pictures/主1.jpg" style="width:100%;height:100%;object-fit:cover;border-radius:10px;display:block" alt="工作室头像"></div><div class="mcn-account-copy"><strong>麦西恩</strong></div></div>
      <div class="mcn-staff">
        <span class="lbl">麦西恩工作室</span>
        <span class="staff-chip studio"><i></i>麦西恩</span>
        <span class="staff-chip"><i></i>张三</span>
        <span class="staff-chip"><i></i>李四</span>
        <span class="staff-chip off" onclick="if(typeof openAssign==='function')openAssign()"><i></i>王五 <em>下午请假</em></span>
        <span class="staff-chip"><i></i>赵六</span>
      </div>
    </aside>

    <!-- 2. 中左侧消息栏 -->
    <section class="w-[340px] bg-surface border-r border-slate-200 flex flex-col shrink-0">
      <div class="h-16 px-5 py-0 bg-white/80 backdrop-blur border-b border-slate-200 flex items-center shrink-0">
        <h2 class="font-bold text-slate-800 text-lg">运营复盘</h2>
      </div>
      <div class="flex-1 overflow-y-auto p-4 space-y-3" id="msgList">
        <!-- 卡片由 JS 渲染 -->
      </div>
    </section>

    <!-- 3. 右侧对话框 -->
    <main class="flex-1 flex flex-col bg-white min-w-0">
      <!-- 顶部 -->
      <header class="h-16 px-5 py-0 border-b border-slate-100 flex items-center justify-between bg-white/90 backdrop-blur z-10 shrink-0">
        <div class="flex items-center gap-3">
          <div id="chatAvatar" class="w-9 h-9 rounded-full flex items-center justify-center overflow-hidden"></div>
          <div>
            <div id="chatTitle" class="text-sm font-bold text-slate-800">财富圈复盘助手</div>
          </div>
        </div>
        <div class="relative">

            <button id="menuHistory" class="w-full flex items-center gap-2.5 px-3 py-2 text-xs text-slate-700 hover:bg-slate-50 transition"><svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>历史对话</button>
            <button id="menuClear" class="w-full flex items-center gap-2.5 px-3 py-2 text-xs text-slate-700 hover:bg-slate-50 transition"><svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>清除对话</button>
          </div>

      <!-- 聊天内容 -->

      </div>

      <!-- 建议提示 -->

      <!-- 输入区 -->

          <div class="flex items-start gap-2 px-3 pt-2">

          </div>
          <div class="flex items-center justify-between px-2 pb-2 pt-1">
            <div class="flex items-center gap-1">

              <button class="p-1.5 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg transition" title="语音输入">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
              </button>
            </div>
            <div class="flex items-center gap-1">
              <!-- 模型选择器 -->
              <div class="relative" id="modelSelector">
                <button id="modelSelectBtn" class="flex items-center gap-1.5 px-2.5 py-1.5 text-xs text-slate-600 hover:bg-slate-100 rounded-lg transition">

        tab.style.display = n > 0 ? 'flex' : 'none';
      }
    }

    function markAssistantRead(key) {
      const a = assistants[key];
      if (a) a.unreadMain = 0;
      tasks.filter(t => t.assistant === key && t.status === 'success').forEach(t => t.viewed = true);
      saveReviewState();
    }

    function handleAssistantClick(key, event) {
      event.stopPropagation();
      if (expanded.has(key)) {
        expanded.delete(key);
      } else {
        expanded.add(key);
      }
      currentKey = key;
      currentTaskId = null;
      markAssistantRead(key);
      renderMsgList();
      renderChatHeader();
      renderQuickPrompts();
      renderWelcome();
      renderTabBadges();
    }

    function openTask(taskId, event) {
      event.stopPropagation();
      currentTaskId = taskId;
      const t = tasks.find(x => x.id === taskId);
      if (t) {
        currentKey = t.assistant;
        t.viewed = true;
        if (unreadCount(t.assistant) === 0) {
          const a = assistants[t.assistant];
          if (a) a.unreadMain = 0;
        }
      }
      saveReviewState();
      renderMsgList();
      renderChatHeader();
      renderQuickPrompts();
      renderTaskChat();
      renderTabBadges();
    }

    // ================== 顶部标题渲染 ==================
    function renderChatHeader() {
      const a = assistants[currentKey];
      document.getElementById('chatTitle').textContent = currentTaskId ? (tasks.find(t => t.id === currentTaskId)?.name || a.name) : a.name;
      document.getElementById('chatAvatar').innerHTML = renderAvatar(currentKey, 'w-full h-full');
    }

    // ================== 聊天消息渲染 ==================
    function clearChat() { chatArea.innerHTML = ''; }

    function appendUser(text) {
      const div = document.createElement('div');
      div.className = 'chat-bubble flex justify-end';
      div.innerHTML = `<div class="max-w-[70%] px-4 py-2.5 bg-brand-600 text-white text-sm rounded-2xl rounded-tr-md shadow-sm">${escapeHtml(text)}</div>`;
      chatArea.appendChild(div);
      scrollChat();
    }

    function appendBot(html, delay=0) {
      const wrapper = document.createElement('div');
      wrapper.className = 'chat-bubble flex gap-3';
      wrapper.style.animationDelay = delay + 'ms';
      wrapper.innerHTML = `
        ${renderAvatar(currentKey, 'w-8 h-8 shrink-0')}
        <div class="max-w-[80%] bg-white border border-slate-100 rounded-2xl rounded-tl-md px-4 py-3 shadow-sm text-sm text-slate-700">${html}</div>
      `;
      chatArea.appendChild(wrapper);
      scrollChat();
      return wrapper.querySelector('.max-w-\\[80\\%\\]');
    }

    function appendTyping() {
      const id = 'typing-' + Date.now();
      appendBot(`<div id="${id}" class="flex items-center gap-1 h-5"><span class="w-1.5 h-1.5 bg-slate-400 rounded-full typing-dot"></span><span class="w-1.5 h-1.5 bg-slate-400 rounded-full typing-dot"></span><span class="w-1.5 h-1.5 bg-slate-400 rounded-full typing-dot"></span></div>`);
      return id;
    }

    function removeTyping(id) {
      const el = document.getElementById(id);
      if (el) el.closest('.chat-bubble').remove();
    }

    // ================== 文本块直接渲染（保留渐显节奏） ==================
    async function typeTextInto(element, html, speed=18) {
      element.innerHTML = html;
      scrollChat();
      await wait(80);
    }

    // ================== 区块渐显 ==================
    async function revealBlocks(container) {
      const blocks = container.querySelectorAll('.reveal-block');
      for (let i = 0; i < blocks.length; i++) {
        await wait(280);
        blocks[i].classList.add('visible');
        scrollChat();
      }
    }

    // ================== 工作流进度条（思考/执行环节） ==================
    // 步骤初始为「待执行」(灰色)，执行时进入「运行中」(旋转)，完成后变为「已完成」(品牌色对勾)
    // 返回 setRunning/setDone/collapse 控制器，在指定容器内渲染，执行完可自动折叠成小结
    function renderWorkflowProgress(container, steps, title) {
      const pid = 'progress-' + Date.now();
      const box = document.createElement('div');
      box.id = pid;
      box.innerHTML = `
        <div class="text-xs text-slate-400 mb-2">${title}</div>
        ${steps.map((s, i) => `<div class="flex items-center gap-2 text-xs text-slate-400 step-item" data-idx="${i}">
          <span class="step-dot w-4 h-4 rounded-full border-2 border-slate-300 flex items-center justify-center shrink-0"></span>
          <span>${s}</span>
        </div>`).join('')}
      `;
      container.appendChild(box);
      scrollChat();
      const items = [...box.querySelectorAll('.step-item')];
      return {
        setRunning(idx) {
          const el = items[idx];
          if (!el) return;
          el.classList.add('text-brand-600', 'font-medium');
          el.classList.remove('text-slate-400');
          el.querySelector('.step-dot').className = 'step-dot w-4 h-4 rounded-full border-2 border-brand-400 flex items-center justify-center shrink-0';
          el.querySelector('.step-dot').innerHTML = `<svg class="w-3 h-3 text-brand-500 spin-slow" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>`;
        },
        setDone(idx) {
          const el = items[idx];
          if (!el) return;
          el.classList.add('text-brand-700', 'font-medium');
          el.classList.remove('text-slate-400', 'text-brand-600');
          el.querySelector('.step-dot').className = 'step-dot w-4 h-4 rounded-full bg-brand-500 flex items-center justify-center shrink-0';
          el.querySelector('.step-dot').innerHTML = `<svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>`;
        },
        collapse() {
          box.innerHTML = `<div class="text-[11px] text-slate-400 flex items-center gap-1.5"><svg class="w-3 h-3 text-brand-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>已执行 ${steps.length} 步工作流</div>`;
        }
      };
    }

    // ================== 单气泡：思考过程 + 答案 合并渲染 ==================
    function appendAnswerBubble() {
      const wrapper = document.createElement('div');
      wrapper.className = 'chat-bubble flex gap-3';
      wrapper.innerHTML = `
        ${renderAvatar(currentKey, 'w-8 h-8 shrink-0')}
        <div class="max-w-[80%] bg-white border border-slate-100 rounded-2xl rounded-tl-md px-4 py-3 shadow-sm text-sm text-slate-700 space-y-3"></div>
      `;
      chatArea.appendChild(wrapper);
      scrollChat();
      return wrapper.querySelector('.max-w-\\[80\\%\\]');
    }

    // ================== 提示气泡渲染 ==================
    function renderQuickPrompts() {
      quickPrompts.innerHTML = '';
      assistants[currentKey].prompts.forEach(p => {
        const chip = document.createElement('button');
        chip.className = 'prompt-chip px-3 py-1.5 bg-white border border-slate-200 rounded-full text-xs text-slate-600';
        chip.textContent = p;
        chip.onclick = () => sendPrompt(p);
        quickPrompts.appendChild(chip);
      });
    }

    // ================== 欢迎语 ==================
    function renderWelcome() {
      clearChat();
      quickPrompts.style.display = 'flex';
      const a = assistants[currentKey];
      appendBot(`<div class="text-slate-600 text-sm leading-relaxed">你好，我是 <strong>${a.name}</strong>。我可以帮你${a.ability}，也支持设置定时任务。</div>`);
    }

    // ================== 发送提示问题 ==================
    async function sendPrompt(prompt) {
      if (currentTaskId) {
        currentTaskId = null;
        renderMsgList();
      }
      chatInput.value = '';
      quickPrompts.style.display = 'none';
      clearChat();
      appendUser(prompt);
      await wait(300);
      // 思考 + 按工作流顺序执行环节（不直接给答复），同一气泡内完成
      const bubble = appendAnswerBubble();
      const wf = renderWorkflowProgress(bubble, workflows[currentKey].steps, '正在按工作流执行 · ' + assistants[currentKey].name);
      for (let i = 0; i < workflows[currentKey].steps.length; i++) {
        wf.setRunning(i);
        await wait(1100);
        wf.setDone(i);
      }
      await wait(450);
      wf.collapse();
      await wait(300);
      await renderAnswer(currentKey, prompt, bubble);
      quickPrompts.style.display = 'flex';
    }

    // ================== 渲染答案（分块渐显 + 图表） ==================
    async function renderAnswer(key, prompt, container) {
      const blocks = promptAnswers[key][prompt];
      if (!blocks) return;
      let target = container;
      if (!target) {
        const bubble = appendBot(`<div class="space-y-3 answer-blocks"></div>`);
        target = bubble.querySelector('.answer-blocks');
      }

      for (const block of blocks) {
        const div = document.createElement('div');
        div.className = 'reveal-block';
        if (block.type === 'text') {
          div.className += ' leading-relaxed text-slate-700';
          div.innerHTML = block.content;
          container.appendChild(div);
          await wait(120);
          div.classList.add('visible');
        } else if (block.type === 'cards') {
          div.innerHTML = block.html;
          container.appendChild(div);
          await wait(200);
          div.classList.add('visible');
        } else if (block.type === 'chart') {
          div.innerHTML = `<div style="height:${block.height}px"><canvas id="${block.id}"></canvas></div>`;
          container.appendChild(div);
          await wait(200);
          div.classList.add('visible');
          new Chart(document.getElementById(block.id), block.config);
        } else if (block.type === 'tip') {
          div.className += ' text-xs text-slate-500 border-t border-slate-100 pt-2 mt-2';
          div.innerHTML = block.content;
          container.appendChild(div);
          await wait(120);
          div.classList.add('visible');
        }
        scrollChat();
      }
    }

    // ================== 定时任务工作流执行 ==================
    async function runWorkflow(key, question, taskId) {
      currentKey = key;
      currentTaskId = taskId;
      renderMsgList();
      renderChatHeader();
      clearChat();
      quickPrompts.style.display = 'none';

      appendBot(`<div class="text-xs text-slate-500 flex items-center gap-1.5"><svg class="w-3.5 h-3.5 text-brand-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>定时任务触发 · ${workflows[key].title}</div>`);
      await wait(400);
      appendUser(question);
      await wait(500);

      const bubble = appendAnswerBubble();
      const wf = renderWorkflowProgress(bubble, workflows[key].steps, '正在按工作流执行 · ' + workflows[key].title);
      for (let i = 0; i < workflows[key].steps.length; i++) {
        wf.setRunning(i);
        await wait(1100);
        wf.setDone(i);
      }
      await wait(400);
      wf.collapse();
      await wait(300);

      const prompt = assistants[key].prompts[0];
      await renderAnswer(key, prompt, bubble);

      const t = tasks.find(x => x.id === taskId);
      if (t) t.status = 'success';
      renderMsgList();
      quickPrompts.style.display = 'flex';
    }

    // ================== 任务对话渲染 ==================
    function renderTaskChat() {
      const t = tasks.find(x => x.id === currentTaskId);
      clearChat();
      if (!t || t.history.length === 0) {
        appendBot(`<div class="text-slate-500 text-sm">这是「${t?.name || ''}」的定时任务对话记录。任务按计划执行后会在此展示完整过程与结果。</div>`);
        return;
      }
      t.history.forEach(h => {
        if (h.role === 'user') appendUser(h.content);
        else appendBot(h.content);
      });
    }

    // ================== 模型选择器渲染与切换 ==================
    function renderModelSelector() {
      const model = models.find(m => m.key === currentModel) || models[models.length - 1];
      document.getElementById('modelSelectIcon').innerHTML = model.icon;
      document.getElementById('modelSelectLabel').textContent = model.name;

        <button class="w-full flex items-center gap-2 px-3 py-2 text-xs ${m.key === currentModel ? 'bg-slate-50 text-brand-600 font-medium' : 'text-slate-700 hover:bg-slate-50'} transition" data-key="${m.key}">
          <span class="shrink-0">${m.icon}</span>
          <span>${m.name}</span>
          ${m.key === currentModel ? '<svg class="w-3.5 h-3.5 ml-auto text-brand-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>' : ''}
        </button>
      `).join('');
      document.getElementById('modelSelectOptions').innerHTML = optionsHtml;
    }
    function toggleModelDropdown(show) {

    // ================== 事件绑定 ==================
    document.getElementById('sendBtn').onclick = () => {
      const q = chatInput.value.trim();
      if (!q) return;
      chatInput.value = '';
      appendUser(q);
      const typingId = appendTyping();

        removeTyping(typingId);
        appendBot(`<p class="text-slate-500">已收到你的问题。当前 Demo 重点展示“提示回答 + 定时任务自动执行”流程，如需针对“${escapeHtml(q)}”生成完整报告，可点击“定时任务”设置自动复盘。</p>`);
      }, 1200);
    };

    // SOP 弹窗
    function toggleSop(show) {
      const m = document.getElementById('sopModal'), p = document.getElementById('sopPanel');
      if (show) { m.classList.remove('hidden'); m.classList.add('flex'); setTimeout(()=>{p.classList.remove('scale-95','opacity-0');p.classList.add('scale-100','opacity-100');},10); }

    }
    document.getElementById('sopBtn')?.addEventListener('click', () => toggleSop(true));

    // 通知 / 链接弹窗
    const notifModal = document.getElementById('notifModal'), linkModal = document.getElementById('linkModal');
    document.getElementById('bellBtn')?.addEventListener('click', (e) => { e.stopPropagation(); linkModal.classList.add('hidden'); notifModal.classList.toggle('hidden'); });
    document.getElementById('linkBtn')?.addEventListener('click', (e) => { e.stopPropagation(); notifModal.classList.add('hidden'); linkModal.classList.toggle('hidden'); });
    document.addEventListener('click', () => { notifModal.classList.add('hidden'); linkModal.classList.add('hidden'); toggleAvatarMenu(false); toggleModelDropdown(false); hideSearchResults(); });
    notifModal.onclick = e => e.stopPropagation(); linkModal.onclick = e => e.stopPropagation();

    // ================== 全局搜索 ==================
    const appsIndex = [
      { key: 'leban', name: '乐伴', action: () => { linkModal.classList.remove('hidden'); } },
      { key: 'liata', name: '聊TA', action: () => { linkModal.classList.remove('hidden'); } },
      { key: 'tec', name: 'TEC', action: () => { linkModal.classList.remove('hidden'); } },
      { key: 'ledo', name: '乐道', action: () => { linkModal.classList.remove('hidden'); } },
      { key: 'taiwei', name: '泰为', action: () => { linkModal.classList.remove('hidden'); } }
    ];

    function fuzzy(q, text) {
      if (!q) return false;
      const Q = q.toLowerCase(), T = text.toLowerCase();
      if (T.includes(Q)) return true;
      let ti = 0;
      for (let i = 0; i < Q.length; i++) {
        const idx = T.indexOf(Q[i], ti);
        if (idx === -1) return false;
        ti = idx + 1;
      }
      return true;
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function hideSearchResults() {
      document.getElementById('searchResults').classList.add('hidden');
    }

    function renderSearchResults(q) {
      const wrap = document.getElementById('searchResults');
      const clear = document.getElementById('searchClear');
      clear.classList.toggle('hidden', !q);
      if (!q) { wrap.classList.add('hidden'); wrap.innerHTML = ''; return; }

      const msgHits = [], wfHits = [], appHits = [];
      Object.entries(assistants).forEach(([key, a]) => {
        const texts = [a.name, a.ability, a.summary, ...(a.prompts || [])];
        if (texts.some(t => fuzzy(q, t))) msgHits.push({ key, name: a.name, sub: a.summary });
      });
      Object.entries(workflows).forEach(([key, wf]) => {
        if (wf.steps.some(s => fuzzy(q, s)) || fuzzy(q, assistants[key]?.name || '')) {
          wfHits.push({ key, name: assistants[key]?.name || key, sub: wf.steps.join(' · ') });
        }
      });
      appsIndex.forEach(app => {
        if (fuzzy(q, app.name)) appHits.push(app);
      });

      if (msgHits.length + wfHits.length + appHits.length === 0) {
        wrap.innerHTML = `<div class="px-3 py-4 text-xs text-slate-400 text-center">未找到与 “${escapeHtml(q)}” 相关的结果</div>`;
        wrap.classList.remove('hidden');
        return;
      }

      let html = '';
      const section = (title, items, icon, onClick) => {
        if (!items.length) return '';
        return `<div class="px-3 py-1.5 text-[10px] font-semibold text-slate-400 uppercase tracking-wide">${title}</div>` +
          items.map(it => `<div class="px-3 py-2 hover:bg-slate-50 cursor-pointer flex items-center gap-2" onclick="${onClick(it)}">
            <span class="w-6 h-6 rounded-md bg-slate-100 text-slate-500 flex items-center justify-center">${icon}</span>
            <div class="flex-1 min-w-0"><div class="text-xs font-medium text-slate-700 truncate">${escapeHtml(it.name)}</div><div class="text-[10px] text-slate-400 truncate">${escapeHtml(it.sub || '')}</div></div>
          </div>`).join('');
      };
      html += section('消息', msgHits, '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>', it => `handleAssistantClick('${it.key}', event); hideSearchResults();`);
      html += section('工作流', wfHits, '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>', it => `handleAssistantClick('${it.key}', event); hideSearchResults();`);
      html += section('应用', appHits, '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>', it => `appsIndex.find(a=>a.key==='${it.key}')?.action(); hideSearchResults();`);

      wrap.innerHTML = html;
      wrap.classList.remove('hidden');
    }

    const globalSearch = document.getElementById('globalSearch');
    const searchResults = document.getElementById('searchResults');
    if (globalSearch && searchResults) {
      globalSearch.addEventListener('input', e => renderSearchResults(e.target.value.trim()));
      globalSearch.addEventListener('focus', e => renderSearchResults(e.target.value.trim()));
      globalSearch.addEventListener('keydown', e => { if (e.key === 'Escape') { globalSearch.value = ''; hideSearchResults(); } });
      document.getElementById('searchClear').onclick = e => { e.stopPropagation(); globalSearch.value = ''; globalSearch.focus(); hideSearchResults(); };
      document.getElementById('searchWrap').onclick = e => e.stopPropagation();
      searchResults.onclick = e => e.stopPropagation();
    }

    // ================== 对话菜单（新建/历史/清除） ==================
    const chatMenu = document.getElementById('chatMenu');
    function toggleChatMenu(show) { chatMenu.classList.toggle('hidden', !show); }
    document.getElementById('chatMoreBtn').onclick = (e) => { e.stopPropagation(); toggleChatMenu(chatMenu.classList.contains('hidden')); };
    chatMenu.onclick = e => e.stopPropagation();

    document.getElementById('menuNewChat').onclick = (e) => { e.stopPropagation(); toggleChatMenu(false); currentTaskId = null; renderWelcome(); };

    document.getElementById('menuClear').onclick = (e) => { e.stopPropagation(); toggleChatMenu(false); currentTaskId = null; renderWelcome(); };
    document.getElementById('historyClose').onclick = () => toggleHistory(false);
    document.getElementById('historyModal').onclick = (e) => { if (e.target.id === 'historyModal') toggleHistory(false); };

    // 模型选择器
    document.getElementById('modelSelectBtn').onclick = (e) => { e.stopPropagation(); toggleModelDropdown(document.getElementById('modelSelectDropdown').classList.contains('hidden')); };
    document.getElementById('modelSelectOptions').onclick = (e) => {
      const btn = e.target.closest('[data-key]');
      if (!btn) return;
      currentModel = btn.dataset.key;
      renderModelSelector();
      toggleModelDropdown(false);
    };
    document.getElementById('modelSelectDropdown').onclick = e => e.stopPropagation();

    // 账号菜单
    const accountBox = document.getElementById('accountBox');
    const avatarMenu = document.getElementById('avatarMenu');
    function toggleAvatarMenu(show) {
      if (show) { avatarMenu.classList.remove('hidden'); setTimeout(()=>avatarMenu.classList.add('show'),10); }
      else { avatarMenu.classList.remove('show'); setTimeout(()=>avatarMenu.classList.add('hidden'),180); }
    }
    accountBox.onclick = (e) => { e.stopPropagation(); toggleAvatarMenu(avatarMenu.classList.contains('hidden')); };

    // 定时任务弹窗
    function toggleSchedule(show) {
      const m = document.getElementById('scheduleModal'), p = document.getElementById('schedulePanel');
      if (show) {
        const a = assistants[currentKey];
        document.getElementById('schName').value = a.defaultTask.name;
        document.getElementById('schAssistant').value = currentKey;
        document.getElementById('schInstruction').value = a.defaultTask.instruction;
        document.getElementById('schQuestion').value = a.prompts[0];
        m.classList.remove('hidden'); m.classList.add('flex'); setTimeout(()=>{p.classList.remove('scale-95','opacity-0');p.classList.add('scale-100','opacity-100');},10);
      } else { p.classList.remove('scale-100','opacity-100'); p.classList.add('scale-95','opacity-0'); setTimeout(()=>{m.classList.add('hidden');m.classList.remove('flex');},180); }
    }
    document.getElementById('scheduleBtn').onclick = () => toggleSchedule(true);

    // 排期类型切换
    document.querySelectorAll('.schedule-tab').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.schedule-tab').forEach(b => { b.classList.remove('active'); b.classList.add('text-slate-600'); });
        btn.classList.add('active'); btn.classList.remove('text-slate-600');
      };
    });

    // 星期切换
    document.querySelectorAll('.weekday-pill').forEach(btn => {
      btn.onclick = () => btn.classList.toggle('active');
    });

    // 高级设置展开
    document.getElementById('advToggle').onclick = () => {
      const adv = document.getElementById('advSettings');
      const arrow = document.getElementById('advArrow');
      adv.classList.toggle('hidden');
      arrow.style.transform = adv.classList.contains('hidden') ? 'rotate(0deg)' : 'rotate(180deg)';
    };

    // 执行专家切换时同步默认值
    document.getElementById('schAssistant').onchange = (e) => {
      const key = e.target.value;
      const a = assistants[key];
      document.getElementById('schName').value = a.defaultTask.name;
      document.getElementById('schInstruction').value = a.defaultTask.instruction;
      document.getElementById('schQuestion').value = a.prompts[0];
    };

    // 保存并立即执行
    document.getElementById('runNowBtn').onclick = async () => {
      const key = document.getElementById('schAssistant').value;
      const name = document.getElementById('schName').value;
      const time = document.getElementById('schTime').value;
      const q = document.getElementById('schQuestion').value;
      const activeDays = Array.from(document.querySelectorAll('.weekday-pill.active')).map(b => b.textContent);
      const schedule = activeDays.length === 7 ? `每天 ${time}` : `每周${activeDays.join('')} ${time}`;
      const taskId = 't' + (taskIdCounter++);
      tasks.push({ id: taskId, assistant: key, name: name || assistants[key].defaultTask.name, schedule, question: q, status: 'running', viewed: true, history: [] });
      expanded.add(key);
      toggleSchedule(false);
      await runWorkflow(key, q, taskId);
    };

    // 初始化
    loadReviewState();
    renderModelSelector();
    renderMsgList();
    renderTabBadges();
    renderChatHeader();
    renderQuickPrompts();
    renderWelcome();
  </script>
</body>
</html>
