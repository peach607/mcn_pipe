      { key: 'glm51', name: 'GLM-5.1', icon: `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="4" fill="#1e293b"/><path d="M8 9h6M8 12h8M8 15h5" stroke="white" stroke-width="1.8" stroke-linecap="round"/></svg>` },
      { key: 'glmturbo', name: 'GLM-5v-Turbo', icon: `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="4" fill="#334155"/><path d="M8 9h6M8 12h8M8 15h5" stroke="white" stroke-width="1.8" stroke-linecap="round"/></svg>` },
      { key: 'minimax', name: 'MiniMax-M3', icon: `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="20" height="12" rx="6" fill="#ec4899"/><path d="M7 12c1.5-2 2.5-2 4 0s2.5 2 4 0" stroke="white" stroke-width="1.5" stroke-linecap="round"/></svg>` },
      { key: 'kimi3', name: 'Kimi-K3', icon: `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none"><rect x="2" y="4" width="20" height="16" rx="3" fill="#0f172a"/><path d="M7 8l4 8-2-4h6l-4 8" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>` },
      { key: 'kimi27code', name: 'Kimi-K2.7-Code', icon: `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none"><rect x="2" y="4" width="20" height="16" rx="3" fill="#0f172a"/><path d="M7 8l4 8-2-4h6l-4 8" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>` },
      { key: 'kimi26', name: 'Kimi-K2.6', icon: `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none"><rect x="2" y="4" width="20" height="16" rx="3" fill="#0f172a"/><path d="M7 8l4 8-2-4h6l-4 8" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>` },
      { key: 'dsflash', name: 'Deepseek-V4-Flash', icon: `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#2563eb"/><path d="M7 12c2-3 5-3 7 0s5 3 3 6c-2 3-8 1-8-3" stroke="white" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="12" r="1.5" fill="white"/></svg>` },
      { key: 'dspro', name: 'Deepseek-V4-Pro', icon: `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#1d4ed8"/><path d="M7 12c2-3 5-3 7 0s5 3 3 6c-2 3-8 1-8-3" stroke="white" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="12" r="1.5" fill="white"/></svg>` },
      { key: 'hunyuan', name: '混元大模型', icon: `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#2563eb"/><path d="M9 8v8M15 8v8M9 12h6" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>` }
    ];
    let currentModel = 'dspro';

    // ================== 工具函数 ==================
    function escapeHtml(t) { return t.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function wait(ms) { return new Promise(r => setTimeout(r, ms)); }
    function scrollChat() { chatArea.scrollTop = chatArea.scrollHeight; }

    // ================== 头像渲染 ==================
    function renderAvatar(key, size='w-10 h-10') {
      return `<div class="${size} rounded-full overflow-hidden bg-slate-100 flex items-center justify-center">${avatars.private}</div>`;
    }

    // ================== Tab 切换 ==================
    function switchTab(key) {
      currentKey = key;
      currentTaskId = null;
      const tab = reviewTabs.find(t => t.key === key);
      if (tab) dashboardFrame.src = tab.src;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.key === key);
      });
      markAssistantRead(key);
      renderChatHeader();
      renderQuickPrompts();
      renderWelcome();
      renderTaskPanel();
      renderTabBadges();
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.onclick = () => switchTab(btn.dataset.key);
    });

    // ================== 未读统计 ==================
    const REVIEW_STORAGE_KEY='mcn_unread_review_v3';
    function loadReviewState(){
      try{
        const saved=localStorage.getItem(REVIEW_STORAGE_KEY);
        if(saved){
          const data=JSON.parse(saved);
          Object.keys(assistants).forEach(k=>{if(typeof data.assistants?.[k]==='number')assistants[k].unreadMain=data.assistants[k];});
          if(Array.isArray(data.tasks)){
            data.tasks.forEach(item=>{
              const t=tasks.find(x=>x.id===item.id);
              if(t && typeof item.viewed==='boolean')t.viewed=item.viewed;
            });
          }
        }
      }catch(e){}
    }
    function saveReviewState(){
      try{
        const data={
          assistants:Object.fromEntries(Object.keys(assistants).map(k=>[k,assistants[k].unreadMain])),
          tasks:tasks.map(t=>({id:t.id,viewed:t.viewed})),
          total:totalUnread()
        };
        localStorage.setItem(REVIEW_STORAGE_KEY,JSON.stringify(data));
      }catch(e){}
      document.dispatchEvent(new Event('mcn:unread-updated'));
    }
    function unreadCount(key) {
      const main = assistants[key]?.unreadMain || 0;
      const taskUnread = tasks.filter(t => t.assistant === key && t.status === 'success' && t.viewed === false).length;
      return main + taskUnread;
    }
    function totalUnread() { return Object.keys(assistants).reduce((sum, key) => sum + unreadCount(key), 0); }
    function renderTabBadges() {
      const tab = document.getElementById('tabReviewBadge');
      if (tab) {
        const n = totalUnread();
        tab.textContent = n;
        tab.style.display = n > 0 ? 'flex' : 'none';
      }
    }
    function markAssistantRead(key) {
      const a = assistants[key];
      if (a) a.unreadMain = 0;
      tasks.filter(t => t.assistant === key && t.status === 'success').forEach(t => t.viewed = true);
      saveReviewState();
    }

    // ================== 任务清单渲染 ==================
    function statusLabel(s) { return ({ pending: '未完成', running: '进行中', success: '已完成', error: '失败' })[s] || '未完成'; }
    function pinSvg() { return `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v14l-7 5-7-5V5z"/></svg>`; }
    function dotsSvg() { return `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"/></svg>`; }

    function taskMarkerHtml(t) {
      // 任务前只能有一个标记符号：
      // 设置了定时任务 -> 小时钟（无论是否已完成，定时任务优先显示时钟）
      // 已完成(非定时) -> 绿色圆勾；未完成(非定时) -> 空白圆框
      if (t.schedule || t.scheduleLabel) {
        return `<button class="shrink-0 w-4 h-4 rounded-full border border-brand-400 text-brand-500 flex items-center justify-center" title="定时任务，点击标记完成" onclick="event.stopPropagation(); toggleTaskDone('${t.id}')">
          <svg class="w-2.5 h-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        </button>`;
      }
      if (t.status === 'success') {
        return `<button class="shrink-0 w-4 h-4 rounded-full bg-green-500 flex items-center justify-center" title="点击取消完成" onclick="event.stopPropagation(); toggleTaskDone('${t.id}')">
          <svg class="w-2.5 h-2.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
        </button>`;
      }
      return `<button class="shrink-0 w-4 h-4 rounded-full border border-slate-300 bg-white hover:border-brand-400" title="点击标记完成" onclick="event.stopPropagation(); toggleTaskDone('${t.id}')"></button>`;
    }

    function taskCardHtml(t) {
      const active = currentTaskId === t.id;
      const showDot = t.status === 'success' && t.viewed === false;
      const pinned = !!t.pinned;
      return `
        <div class="task-card relative border ${active ? 'border-brand-300 bg-blue-50/50' : 'border-slate-200 bg-white'} rounded-lg px-3 py-2.5" data-task-id="${t.id}">
          <div class="flex items-center gap-2 pr-12" onclick="openTask('${t.id}')">
            ${taskMarkerHtml(t)}
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-1.5">
                <div class="task-name text-xs font-medium text-slate-800 truncate">${escapeHtml(t.name)}</div>
                ${showDot ? '<span class="shrink-0 w-1.5 h-1.5 bg-red-500 rounded-full"></span>' : ''}
              </div>
              <div class="text-[10px] text-slate-500 truncate">${escapeHtml(t.scheduleLabel || t.schedule || '')}</div>
            </div>
          </div>
          <div class="task-actions absolute right-1.5 top-1/2 -translate-y-1/2 flex items-center gap-0.5 z-10 bg-white/90 rounded-lg px-0.5 py-0.5 shadow-sm">
            <button class="task-pin ${pinned ? 'pinned text-brand-600' : 'text-slate-400'} p-1 rounded hover:bg-slate-100" title="置顶任务" onclick="event.stopPropagation(); togglePin('${t.id}')">${pinSvg()}</button>
            <button class="task-dots p-1 rounded text-slate-400 hover:bg-slate-100" title="更多操作" onclick="event.stopPropagation(); openTaskMenu(event, '${t.id}')">${dotsSvg()}</button>
          </div>
        </div>`;
    }

    function renderTaskPanel() {
      const list = document.getElementById('taskPanelList');
      const currentTasks = tasks.slice();
      document.getElementById('taskCount').textContent = '全部模块 ' + tasks.length + ' 项';
      if (currentTasks.length === 0) {
        list.innerHTML = `<div class="text-[11px] text-slate-400 px-2 py-4 text-center">暂无任务<br/>点击“新建定时任务”添加</div>`;
        return;
      }
      // 两分区：待完成 / 已完成（只看 status；schedule 只影响标记图标，不影响分组）
      const isScheduled = t => !!(t.schedule || t.scheduleLabel);
      const byPin = (a, b) => (!!a.pinned !== !!b.pinned) ? (a.pinned ? -1 : 1) : 0;
      const activeTasks = currentTasks.filter(t => t.status !== 'success');
      const doneTasks = currentTasks.filter(t => t.status === 'success');
      activeTasks.sort(byPin);
      // 已完成内部：有 schedule 的定时任务排在前，普通绿勾排在后
      const doneScheduled = doneTasks.filter(isScheduled);
      const doneNormal = doneTasks.filter(t => !isScheduled(t));
      doneScheduled.sort(byPin);
      doneNormal.sort(byPin);
      const doneAll = doneScheduled.concat(doneNormal);
      const collapseDone = list.dataset.doneCollapsed === '1';
      let html = '';
      if (activeTasks.length) {
        html += `<div class="pt-1">
          <div class="px-1 py-1.5 text-[11px] font-semibold text-slate-500">待完成 (${activeTasks.length})</div>
          <div class="space-y-2" style="margin-top:4px;">${activeTasks.map(t => taskCardHtml(t)).join('')}</div>
        </div>`;
      }
      if (doneAll.length) {
        html += `<div class="pt-1 mt-1 border-t border-slate-100">
          <button class="done-collapse-btn w-full flex items-center gap-1 px-1 py-1.5 text-[11px] font-semibold text-slate-500" onclick="toggleDoneCollapse()">
            <svg class="w-3 h-3 transition-transform ${collapseDone ? '' : 'rotate-180'}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/></svg>
            已完成 (${doneAll.length})
          </button>
          <div class="space-y-2 ${collapseDone ? 'hidden' : ''}" style="margin-top:6px;">
            ${doneAll.map(t => taskCardHtml(t)).join('')}
          </div>
        </div>`;
      }
      list.innerHTML = html;
    }
    function toggleDoneCollapse() {
      const list = document.getElementById('taskPanelList');
      list.dataset.doneCollapsed = list.dataset.doneCollapsed === '1' ? '0' : '1';
      renderTaskPanel();
    }
    function toggleTaskDone(id) {
      const t = tasks.find(x => x.id === id);
      if (!t) return;
      // 勾选仅切换「未完成(pending/running) <-> 已完成(success)」完成态；定时任务的小时钟标记由 schedule 决定，不受此切换影响
      if (t.status === 'success') {
        t.status = 'pending';
        t.viewed = false;
      } else {
        t.status = 'success';
        t.viewed = true;
      }
      renderTaskPanel();
      renderTabBadges();
    }
    function togglePin(id) {
      const t = tasks.find(x => x.id === id);
      if (!t) return;
      t.pinned = !t.pinned;
      renderTaskPanel();
    }
    function openTask(taskId) {
      currentTaskId = taskId;
      const t = tasks.find(x => x.id === taskId);
      if (t) {
        currentKey = t.assistant;
        t.viewed = true;
        if (unreadCount(t.assistant) === 0) {
          const a = assistants[t.assistant];
          if (a) a.unreadMain = 0;
        }
        const tab = reviewTabs.find(rt => rt.key === t.assistant);
        if (tab) dashboardFrame.src = tab.src;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.key === t.assistant));
      }
      saveReviewState();
      renderChatHeader();
      renderQuickPrompts();
      renderTaskChat();
      renderTaskPanel();
      renderTabBadges();
      toggleChatExpand(true);
    }

    // ================== 顶部标题渲染 ==================
    function renderChatHeader() {
      const a = assistants[currentKey];
      const title = currentTaskId ? (tasks.find(t => t.id === currentTaskId)?.name || a.name) : a.name;
      document.getElementById('chatTitle').textContent = title;
      document.getElementById('chatAvatar').innerHTML = renderAvatar(currentKey, 'w-full h-full');
    }

    // ================== 聊天消息渲染 ==================
    function clearChat() { chatArea.innerHTML = ''; }
    function appendUser(text) {
      const div = document.createElement('div');
      div.className = 'chat-bubble flex justify-end';
      div.innerHTML = `<div class="max-w-[70%] px-4 py-2.5 bg-brand-600 text-white text-sm rounded-2xl rounded-tr-md shadow-sm">${escapeHtml(text)}</div>`;
      chatArea.appendChild(div);
      scrollChat();
    }
    function appendBot(html, delay=0) {
      const wrapper = document.createElement('div');
      wrapper.className = 'chat-bubble flex gap-3';
      wrapper.style.animationDelay = delay + 'ms';
      wrapper.innerHTML = `
        ${renderAvatar(currentKey, 'w-8 h-8 shrink-0')}
        <div class="max-w-[80%] bg-white border border-slate-100 rounded-2xl rounded-tl-md px-4 py-3 shadow-sm text-sm text-slate-700">${html}</div>
      `;
      chatArea.appendChild(wrapper);
      scrollChat();
      return wrapper.querySelector('.max-w-\\[80\\%\\]');
    }
    function appendTyping() {
      const id = 'typing-' + Date.now();
      appendBot(`<div id="${id}" class="flex items-center gap-1 h-5"><span class="w-1.5 h-1.5 bg-slate-400 rounded-full typing-dot"></span><span class="w-1.5 h-1.5 bg-slate-400 rounded-full typing-dot"></span><span class="w-1.5 h-1.5 bg-slate-400 rounded-full typing-dot"></span></div>`);
      return id;
    }
    function removeTyping(id) {
      const el = document.getElementById(id);
      if (el) el.closest('.chat-bubble').remove();
    }

    // ================== 工作流进度条 ==================
    function renderWorkflowProgress(container, steps, title) {
      const pid = 'progress-' + Date.now();
      const box = document.createElement('div');
      box.id = pid;
      box.innerHTML = `
        <div class="text-xs text-slate-400 mb-2">${title}</div>
        ${steps.map((s, i) => `<div class="flex items-center gap-2 text-xs text-slate-400 step-item" data-idx="${i}">
          <span class="step-dot w-4 h-4 rounded-full border-2 border-slate-300 flex items-center justify-center shrink-0"></span>
          <span>${s}</span>
        </div>`).join('')}
      `;
      container.appendChild(box);
      scrollChat();
      const items = [...box.querySelectorAll('.step-item')];
      return {
        setRunning(idx) {
          const el = items[idx];
          if (!el) return;
          el.classList.add('text-brand-600', 'font-medium');
          el.classList.remove('text-slate-400');
          el.querySelector('.step-dot').className = 'step-dot w-4 h-4 rounded-full border-2 border-brand-400 flex items-center justify-center shrink-0';
          el.querySelector('.step-dot').innerHTML = `<svg class="w-3 h-3 text-brand-500 spin-slow" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>`;
        },
        setDone(idx) {
          const el = items[idx];
          if (!el) return;
          el.classList.add('text-brand-700', 'font-medium');
          el.classList.remove('text-slate-400', 'text-brand-600');
          el.querySelector('.step-dot').className = 'step-dot w-4 h-4 rounded-full bg-brand-500 flex items-center justify-center shrink-0';
          el.querySelector('.step-dot').innerHTML = `<svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>`;
        },
        collapse() {
          box.innerHTML = `<div class="text-[11px] text-slate-400 flex items-center gap-1.5"><svg class="w-3 h-3 text-brand-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>已执行 ${steps.length} 步工作流</div>`;
        }
      };
    }
    function appendAnswerBubble() {
      const wrapper = document.createElement('div');
      wrapper.className = 'chat-bubble flex gap-3';
      wrapper.innerHTML = `
        ${renderAvatar(currentKey, 'w-8 h-8 shrink-0')}
        <div class="max-w-[80%] bg-white border border-slate-100 rounded-2xl rounded-tl-md px-4 py-3 shadow-sm text-sm text-slate-700 space-y-3"></div>
      `;
      chatArea.appendChild(wrapper);
      scrollChat();
      return wrapper.querySelector('.max-w-\\[80\\%\\]');
    }

    // ================== 提示气泡渲染 ==================
    function renderQuickPrompts() {
      quickPrompts.innerHTML = '';
      assistants[currentKey].prompts.forEach(p => {
        const chip = document.createElement('button');
        chip.className = 'prompt-chip px-3 py-1.5 bg-white border border-slate-200 rounded-full text-xs text-slate-600';
        chip.textContent = p;
        chip.onclick = () => sendPrompt(p);
        quickPrompts.appendChild(chip);
      });
    }

    // ================== 欢迎语 ==================
    function renderWelcome() {
      clearChat();
      quickPrompts.style.display = 'flex';
      const a = assistants[currentKey];
      appendBot(`<div class="text-slate-600 text-sm leading-relaxed">你好，我是 <strong>${a.name}</strong>。我可以帮你${a.ability}，也支持设置定时任务。</div>`);
    }

    // ================== 发送提示问题 ==================
    async function sendPrompt(prompt) {
      toggleChatExpand(true);
      if (currentTaskId) { currentTaskId = null; renderTaskPanel(); }
      chatInput.value = '';
      quickPrompts.style.display = 'none';
      clearChat();
      appendUser(prompt);
      await wait(300);
      const bubble = appendAnswerBubble();
      const wf = renderWorkflowProgress(bubble, workflows[currentKey].steps, '正在按工作流执行 · ' + assistants[currentKey].name);
      for (let i = 0; i < workflows[currentKey].steps.length; i++) {
        wf.setRunning(i);
        await wait(1100);
        wf.setDone(i);
      }
      await wait(450);
      wf.collapse();
      await wait(300);
      await renderAnswer(currentKey, prompt, bubble);
      appendImprovementSuggestions(currentKey, prompt);
      quickPrompts.style.display = 'flex';
    }

    // ================== 渲染答案（分块渐显 + 图表） ==================
    async function renderAnswer(key, prompt, container) {
      const blocks = promptAnswers[key][prompt];
      if (!blocks) return;
      let target = container;
      if (!target) {
        const bubble = appendBot(`<div class="space-y-3 answer-blocks"></div>`);
        target = bubble.querySelector('.answer-blocks');
      }

      for (const block of blocks) {
        const div = document.createElement('div');
        div.className = 'reveal-block';
        if (block.type === 'text') {
          div.className += ' leading-relaxed text-slate-700';
          div.innerHTML = block.content;
          container.appendChild(div);
          await wait(120);
          div.classList.add('visible');
        } else if (block.type === 'cards') {
          div.innerHTML = block.html;
          container.appendChild(div);
          await wait(200);
          div.classList.add('visible');
        } else if (block.type === 'chart') {
          div.innerHTML = `<div style="height:${block.height}px"><canvas id="${block.id}"></canvas></div>`;
          container.appendChild(div);
          await wait(200);
          div.classList.add('visible');
          new Chart(document.getElementById(block.id), block.config);
        } else if (block.type === 'tip') {
          div.className += ' text-xs text-slate-500 border-t border-slate-100 pt-2 mt-2';
          div.innerHTML = block.content;
          container.appendChild(div);
          await wait(120);
          div.classList.add('visible');
        }
        scrollChat();
      }
    }

    // ================== 定时任务工作流执行 ==================
    async function runWorkflow(key, question, taskId) {
      currentKey = key;
      currentTaskId = taskId;
      const tab = reviewTabs.find(t => t.key === key);
      if (tab) dashboardFrame.src = tab.src;

    function fuzzy(q, text) {
      if (!q) return false;
      const Q = q.toLowerCase(), T = text.toLowerCase();
      if (T.includes(Q)) return true;
      let ti = 0;
      for (let i = 0; i < Q.length; i++) {
        const idx = T.indexOf(Q[i], ti);
        if (idx === -1) return false;
        ti = idx + 1;
      }
      return true;
    }

    function renderSearchResults(q) {
      const wrap = document.getElementById('searchResults');
      const clear = document.getElementById('searchClear');
      clear.classList.toggle('hidden', !q);
      if (!q) { wrap.classList.add('hidden'); wrap.innerHTML = ''; return; }

      const msgHits = [], wfHits = [], appHits = [];
      Object.entries(assistants).forEach(([key, a]) => {
        const texts = [a.name, a.ability, a.summary, ...(a.prompts || [])];
        if (texts.some(t => fuzzy(q, t))) msgHits.push({ key, name: a.name, sub: a.summary });
      });
      Object.entries(workflows).forEach(([key, wf]) => {
        if (wf.steps.some(s => fuzzy(q, s)) || fuzzy(q, assistants[key]?.name || '')) {
          wfHits.push({ key, name: assistants[key]?.name || key, sub: wf.steps.join(' · ') });
        }
      });
      appsIndex.forEach(app => { if (fuzzy(q, app.name)) appHits.push(app); });

      if (msgHits.length + wfHits.length + appHits.length === 0) {
        wrap.innerHTML = `<div class="px-3 py-4 text-xs text-slate-400 text-center">未找到与 “${escapeHtml(q)}” 相关的结果</div>`;
        wrap.classList.remove('hidden');
        return;
      }

      let html = '';
      const section = (title, items, icon, onClick) => {
        if (!items.length) return '';
        return `<div class="px-3 py-1.5 text-[10px] font-semibold text-slate-400 uppercase tracking-wide">${title}</div>` +
          items.map(it => `<div class="px-3 py-2 hover:bg-slate-50 cursor-pointer flex items-center gap-2" onclick="${onClick(it)}">
            <span class="w-6 h-6 rounded-md bg-slate-100 text-slate-500 flex items-center justify-center">${icon}</span>
            <div class="flex-1 min-w-0"><div class="text-xs font-medium text-slate-700 truncate">${escapeHtml(it.name)}</div><div class="text-[10px] text-slate-400 truncate">${escapeHtml(it.sub || '')}</div></div>
          </div>`).join('');
      };
      html += section('消息', msgHits, '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>', it => `switchTab('${it.key}'); hideSearchResults();`);
      html += section('工作流', wfHits, '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>', it => `switchTab('${it.key}'); hideSearchResults();`);
      html += section('应用', appHits, '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>', it => `appsIndex.find(a=>a.key==='${it.key}')?.action(); hideSearchResults();`);

      wrap.innerHTML = html;
      wrap.classList.remove('hidden');
    }

    const globalSearch = document.getElementById('globalSearch');
    const searchResults = document.getElementById('searchResults');
    if (globalSearch && searchResults) {
      globalSearch.addEventListener('input', e => renderSearchResults(e.target.value.trim()));
      globalSearch.addEventListener('focus', e => renderSearchResults(e.target.value.trim()));
      globalSearch.addEventListener('keydown', e => { if (e.key === 'Escape') { globalSearch.value = ''; hideSearchResults(); } });
      document.getElementById('searchClear').onclick = e => { e.stopPropagation(); globalSearch.value = ''; globalSearch.focus(); hideSearchResults(); };
      document.getElementById('searchWrap').onclick = e => e.stopPropagation();
      searchResults.onclick = e => e.stopPropagation();
    }

    // 初始化
    loadReviewState();
    switchTab('weekly');
    renderModelSelector();
    renderTabBadges();
    // 若 iframe 已完成初始加载，立即执行看板精简
    if (dashboardFrame.contentDocument?.readyState === 'complete') pruneDashboard();
  </script>
</body>
</html>
