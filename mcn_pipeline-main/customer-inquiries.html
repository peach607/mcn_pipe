}
const searchClear=document.getElementById('searchClear');
if(searchClear)searchClear.onclick=e=>{e.stopPropagation();globalSearch.value='';globalSearch.focus();hideSearchResults()};
const searchWrap=document.getElementById('searchWrap');
if(searchWrap)searchWrap.onclick=e=>e.stopPropagation();
const searchResults=document.getElementById('searchResults');
if(searchResults)searchResults.onclick=e=>e.stopPropagation();
document.addEventListener('click',hideSearchResults);

// ================== 对话菜单 ==================
const chatMenu=document.getElementById('chatMenu');
function toggleChatMenu(show){chatMenu.classList.toggle('show',!!show)}
document.getElementById('chatMoreBtn').onclick=e=>{e.stopPropagation();toggleChatMenu(!chatMenu.classList.contains('show'))};
chatMenu.onclick=e=>e.stopPropagation();
document.addEventListener('click',()=>toggleChatMenu(false));
function toggleHistory(show){
  const m=document.getElementById('historyModal');
  if(show){document.getElementById('historyList').innerHTML=Object.values(tasks).map(t=>`<div class="mcn-hi-item" onclick="selectTaskByName('${t.name}');toggleHistory(false)"><div class="mcn-hi-ico">${taskIcon(null,t)}</div><div class="mcn-hi-main"><div class="mcn-hi-name">${t.name}</div><div class="mcn-hi-sub">${t.summary}</div></div></div>`).join('');m.classList.add('show')}
  else{m.classList.remove('show')}
}
function selectTaskByName(name){const k=Object.keys(tasks).find(x=>tasks[x].name===name);if(k){filter=tasks[k].status;activateTab(filter);selectTask(k)}}
document.getElementById('menuNewChat').onclick=e=>{e.stopPropagation();toggleChatMenu(false);filter='pending';activateTab('pending');const k=Object.keys(tasks).find(x=>tasks[x].status==='pending')||'welcome';selectTask(k)};
document.getElementById('menuHistory').onclick=e=>{e.stopPropagation();toggleChatMenu(false);toggleHistory(true)};
document.getElementById('menuClear').onclick=e=>{e.stopPropagation();toggleChatMenu(false);current='welcome';filter='pending';activateTab('pending');selectTask('welcome')};
document.getElementById('historyClose').onclick=()=>toggleHistory(false);
document.getElementById('historyModal').onclick=e=>{if(e.target.id==='historyModal')toggleHistory(false)};
</script>

<!-- 历史对话弹窗 -->
<div id="historyModal" class="mcn-history-mask">
  <div class="mcn-history-panel">
    <div class="mcn-history-head"><div class="mcn-history-title">历史对话</div><button id="historyClose" class="mcn-history-close"><svg class="mcn-ico-sm" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button></div>
    <div id="historyList" class="mcn-history-list"></div>
  </div>
</div>
</body>
</html>
