<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mcn工作台</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0f172a; --muted:#64748b; --faint:#94a3b8; --line:#e2e8f0; --bg:#f4f6f9;
  --violet:#2563eb; --violet-deep:#1d4ed8; --violet-soft:#eff6ff; --violet-line:#bfdbfe;
  --red:#dc454b; --red-soft:#fff1f1; --red-line:#f3d3d3;
  --blue:#4a7caf; --blue-bg:#eef4fa; --blue-line:#d3e1ef;
  --yellow:#c07f16; --yellow-bg:#fdf3e0; --yellow-line:#f0dcba;
  --gray-bg:#f0f0f3; --gray-line:#e3e3e8; --gray-tx:#a6a6ae;
  --green:#268e6a; --shadow:0 10px 30px rgba(27,25,45,.07);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#e8ecf3;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}
button,input{font:inherit}button{cursor:pointer;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#d9d9df;border-radius:4px}

/* ===== 骨架（与参考风格一致） ===== */
.shell{display:grid;grid-template-columns:220px 1fr;width:calc(100% - 32px);height:calc(100vh - 32px);max-width:1600px;max-height:960px;margin:16px auto;overflow:hidden;background:#fff;border:1px solid rgba(255,255,255,.75);border-radius:16px;box-shadow:0 24px 70px rgba(15,23,42,.18)}
.rail{background:#fff;color:#334155;display:flex;flex-direction:column;align-items:stretch;padding:0;border-right:1px solid #e2e8f0}
.logo{width:100%;height:72px;padding:0 16px;border-radius:0;background:none;display:flex;align-items:center;justify-content:flex-start;gap:8px;box-shadow:none;border-bottom:1px solid #f1f5f9}.logo strong{font-size:15px;line-height:1;color:#1e293b}.logo span{font-size:15px;line-height:1;color:#1e293b;font-weight:700}
.rail-nav{display:grid;gap:4px;margin-top:12px;padding:0 12px;width:100%}
.rail-btn{border:0;border-radius:8px;background:none;color:#64748b;min-height:42px;padding:0 11px;display:flex;align-items:center;gap:11px;font-size:13px;position:relative;text-align:left}
.rail-btn b{width:20px;font-size:18px;font-weight:400;text-align:center}.rail-btn span{font-weight:600}
.rail-btn:hover,.rail-btn.active{background:#eff6ff;color:#2563eb}.rail-btn.active::before{display:none}
.avatar{margin:12px;width:auto;height:40px;border:0;border-radius:8px;background:#f8fafc;color:#64748b}
.work{display:grid;grid-template-rows:minmax(0,1fr);min-width:0;min-height:0;height:100%;background:var(--bg)}

/* ===== 主区：日历 + 对话 ===== */
.body{display:grid;grid-template-columns:1fr;gap:0;padding:0;min-height:0}

/* ===== 时间瀑布流 ===== */
.calendar{background:#fff;border:1px solid var(--line);border-right:0;border-radius:0;box-shadow:none;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.cal-head{display:flex;align-items:center;gap:12px;padding:12px 14px 10px;border-bottom:1px solid var(--line);min-height:0}
.cal-title{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0}
.cal-head h3{font-size:18px;margin:0;font-weight:700;color:#1e293b;line-height:1.2;white-space:nowrap}
.cal-head small{font-size:11px;color:var(--muted);line-height:1.2;white-space:nowrap}
.legend{display:flex;flex:none;align-items:center;gap:8px;font-size:9px;color:var(--muted);margin-left:auto;white-space:nowrap;flex-wrap:nowrap}
.legend i{font-style:normal;display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:3px;vertical-align:-1px}
.l-b{background:var(--blue)}.l-y{background:#e49a37}.l-r{background:var(--red)}.l-g{background:#c9c9d0}
.timeline{flex:1;min-height:0;overflow-y:auto;padding:8px 12px 18px 10px;position:relative}
.timeline::before{content:"";position:absolute;left:55px;top:18px;bottom:18px;width:1px;background:#e7e7ec}
.time-group{display:grid;grid-template-columns:44px 1fr;gap:12px;position:relative;padding:8px 0 12px}
.time-label{font-size:10px;color:#a0a0aa;font-variant-numeric:tabular-nums;text-align:right;padding:5px 8px 0 0;position:relative}
.time-label::after{content:"";position:absolute;right:-19px;top:9px;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid #cfcfd7;z-index:2}
.time-group.current .time-label{color:var(--violet);font-weight:700}
.time-group.current .time-label::after{border-color:var(--violet);box-shadow:0 0 0 4px rgba(104,82,223,.12)}
.time-cards{display:grid;gap:8px;min-width:0}
.flow-task{position:relative;border:1px solid var(--line);border-radius:10px;padding:10px 11px 9px 13px;background:#fff;transition:box-shadow .15s,transform .15s,border-color .15s;overflow:hidden}
.flow-task::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#c9c9d0}
.flow-task:hover{box-shadow:0 7px 18px rgba(27,25,45,.09);transform:translateY(-1px)}
.flow-task.linked{cursor:pointer}
.flow-task .flow-top{display:flex;align-items:center;gap:7px;min-width:0}
.flow-task .t-title{font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flow-task .t-chip{margin-left:auto;font-size:8.5px;padding:2px 6px;border-radius:4px;font-weight:700;flex:none}
.flow-task .flow-meta{display:flex;align-items:center;gap:7px;margin-top:5px;font-size:9.5px;color:var(--muted);flex-wrap:wrap}
.flow-task .flow-meta span{display:inline-flex;align-items:center;gap:4px}
.flow-task .flow-meta i{width:4px;height:4px;border-radius:50%;background:#c8c8cf}
.flow-task.routine{background:var(--blue-bg);border-color:var(--blue-line)}
.flow-task.routine::before{background:var(--blue)}
.flow-task.optional{background:var(--yellow-bg);border-color:var(--yellow-line);cursor:pointer}
.flow-task.optional::before{background:#e49a37}
.flow-task.optional .t-chip{background:#f7e6c4;color:var(--yellow)}
.flow-task.must{background:var(--red-soft);border-color:var(--red-line);cursor:pointer}
.flow-task.must::before{background:var(--red)}
.flow-task.must .t-chip{background:#f7d6d6;color:var(--red)}
.flow-task.done{opacity:.53;background:#f6f6f8;border-color:var(--gray-line);cursor:default}
.flow-task.done::before{background:#c9c9d0}
.flow-task.done .t-title,.flow-task.done .flow-meta{color:#8d8d96}
.flow-task.done .t-chip{background:#fff;color:#9a9aa2}
.flow-task.missed{border-style:dashed}
.flow-task.missed .t-chip{background:#f7d6d6;color:var(--red)}
.flow-task.flash{animation:flash 1.4s ease}
@keyframes flash{0%,60%{box-shadow:0 0 0 3px rgba(220,69,75,.45)}100%{box-shadow:none}}
.empty-flow{padding:48px 16px;text-align:center;color:var(--faint);font-size:11px}
.cal-head{flex:0 0 auto}.cal-foot{flex:0 0 68px;height:68px;display:grid;gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:10px;color:var(--muted);align-content:center}
.foot-row{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;overflow:hidden}
.foot-row>*{white-space:nowrap}
.foot-link{margin-left:auto;border:1px solid var(--violet-line);background:var(--violet-soft);color:var(--violet-deep);border-radius:6px;padding:3px 8px;font-size:9.5px;font-weight:650}
.foot-link:hover{background:#e4ddff}
.foot-link+.foot-link{margin-left:0}
/* 时间流折叠 */
.fold-bar{margin:6px 0 2px 56px;border:1px dashed var(--gray-line);background:#f7f7f9;color:#8d8d96;border-radius:8px;padding:7px 12px;font-size:10.5px;cursor:pointer;display:flex;gap:5px;align-items:center}
.fold-bar:hover{color:var(--violet-deep);border-color:var(--violet-line)}
.fold-bar b{color:inherit;font-weight:650}
.fold-body{display:none}
.fold-body.open{display:block}
.now-row{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;margin:4px 0 2px}
.now-row .nw-t{font-size:10px;color:var(--violet);font-weight:700;text-align:right;font-variant-numeric:tabular-nums;padding-right:8px}
.now-row .nw-l{height:0;border-top:2px solid var(--violet);position:relative}
.now-row .nw-l::before{content:"";position:absolute;left:-4px;top:-4.5px;width:8px;height:8px;border-radius:50%;background:var(--violet)}
.now-row .nw-l::after{content:"现在";position:absolute;right:0;top:-8px;font-size:9px;color:var(--violet);font-weight:700;background:#fff;padding:0 3px}
/* 会话列表 */
.sess-item{width:100%;border:0;background:none;border-radius:9px;padding:9px 10px;text-align:left;display:grid;gap:3px;margin-bottom:2px}
.sess-item:hover{background:#f1f5f9}
.sess-item.active{background:var(--violet-soft)}
.sess-item strong{font-size:11.5px;font-weight:650}
.sess-item small{font-size:9.5px;color:#9797a0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess-group{font-size:9px;color:var(--faint);padding:9px 4px 4px}
/* 全景图弹层 */
.sheet.pano{width:min(980px,95vw)}
.pano-wrap{padding:12px 16px 14px}
.pano-cols-head{display:grid;grid-template-columns:44px repeat(3,1fr);gap:7px;padding-bottom:6px}
.pano-cols-head span{font-size:10.5px;font-weight:700;color:#5b5b64;text-align:center;padding:4px 0;background:var(--bg);border-radius:6px}
.pano-cols-head span:first-child{background:transparent}
.pano-body{display:grid;grid-template-columns:44px repeat(3,1fr);gap:7px;position:relative;max-height:60vh;overflow-y:auto}
.pano-body .time-axis{position:relative}
.pano-body .tick{position:absolute;right:6px;transform:translateY(-50%);font-size:9.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.pano-body .col{position:relative;border-left:1px solid #f1f1f4}
.pano-body .col::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0,transparent 55px,#f3f3f6 55px,#f3f3f6 56px);pointer-events:none}
.pano-body .now-line{position:absolute;left:44px;right:0;height:0;border-top:2px solid var(--violet);z-index:5;pointer-events:none}
.pano-body .now-line::before{content:"13:15";position:absolute;left:0;top:-8px;background:var(--violet);color:#fff;font-size:9px;padding:1px 6px;border-radius:4px;font-weight:700}
.pano-body .task{position:absolute;border-radius:8px;padding:5px 7px;border:1px solid;background:#fff;overflow:hidden}
.pano-body .task .t-title{font-size:11px;font-weight:650;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pano-body .task .t-time{font-size:9.5px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pano-body .task .t-chip{position:absolute;top:5px;right:6px;font-size:8.5px;padding:1px 5px;border-radius:4px;font-weight:700}
.pano-body .task.routine{background:var(--blue-bg);border-color:var(--blue-line);border-left:3px solid var(--blue)}
.pano-body .task.optional{background:var(--yellow-bg);border-color:var(--yellow-line);border-left:3px solid #e49a37;cursor:pointer}
.pano-body .task.optional .t-chip{background:#f7e6c4;color:var(--yellow)}
.pano-body .task.must{background:var(--red-soft);border-color:var(--red-line);border-left:3px solid var(--red);cursor:pointer}
.pano-body .task.must .t-chip{background:#f7d6d6;color:var(--red)}
.pano-body .task.done{opacity:.5;cursor:default}
.pano-body .task.done .t-title,.pano-body .task.done .t-time{color:#7d7d86}
.pano-body .task.done .t-chip{background:rgba(255,255,255,.75);color:#9a9aa2}
.pano-body .task.missed{border-style:dashed}
.pano-body .task.missed .t-chip{background:#f7d6d6;color:var(--red)}
.staff-chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-size:10px;color:#55555e;background:#fff;flex:none;white-space:nowrap}
.staff-chip i{font-style:normal;width:5px;height:5px;border-radius:50%;background:#4ca481}
.staff-chip.off{color:var(--faint);background:var(--gray-bg);border-style:dashed;cursor:pointer}
.staff-chip.off i{background:#c9c9d0}
.staff-chip.off em{font-style:normal;font-size:9px;color:var(--faint)}
.cal-foot strong{font-size:10px;color:#50505a}.foot-note{margin-left:auto;color:var(--faint);font-size:9px}

/* ===== 对话 ===== */
.chat{background:transparent;border:none;box-shadow:none;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.chat-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.chat-head .ch-title{display:grid;gap:2px}
.chat-head strong{font-size:13px}
.chat-head small{font-size:9.5px;color:var(--muted)}
.sched-btn{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:11px;color:#6a6a73}
.sched-btn:hover{border-color:var(--violet);color:var(--violet-deep)}
.chat-main{flex:1;display:flex;min-height:0}
.chat-col{display:flex;flex-direction:column;justify-content:center;min-height:0;width:100%;padding:18px;background:transparent}
.chat-welcome{padding:10px 14px 0;display:flex;gap:7px;flex-wrap:wrap}
.chat-welcome button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;font-size:10.5px;color:#666670}
.chat-welcome button:hover{border-color:var(--violet-line);background:var(--violet-soft);color:var(--violet-deep)}
.msgs{flex:1;padding:14px 14px 6px;scroll-behavior:smooth}
.welcome-screen{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px 10px;text-align:center}
.welcome-logo{width:240px;height:160px;object-fit:cover;object-position:50% 45%;border-radius:16px;box-shadow:0 12px 30px rgba(37,99,235,.12)}
.welcome-title{font-size:32px;font-weight:800;margin:0;color:#1e293b;letter-spacing:-0.02em;line-height:1.1}
.welcome-title b{color:#2563eb;font-weight:800}
.welcome-slogan{display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px;font-weight:700;letter-spacing:.06em;margin-top:-4px}
.welcome-slogan span{background:linear-gradient(90deg,#2563eb,#1d4ed8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.welcome-slogan span .m{font-size:1.15em;font-weight:800;color:#1d4ed8;-webkit-text-fill-color:#1d4ed8}
.welcome-slogan i{width:24px;height:1px;background:#bfdbfe;position:relative}
.welcome-slogan i::after{content:"";position:absolute;right:0;top:-2px;width:5px;height:5px;border-radius:50%;background:#93c5fd}
.welcome-slogan i:first-child::after{right:auto;left:0}
.welcome-bubbles{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.welcome-bubbles button{display:flex;align-items:center;gap:8px;padding:10px 16px;border:1px solid #bfdbfe;border-radius:999px;background:#fff;color:#1e40af;font-size:12px;font-weight:600;box-shadow:0 2px 8px rgba(37,99,235,.08);transition:.2s;cursor:pointer}
.welcome-bubbles button:hover{background:#eff6ff;border-color:#60a5fa;transform:translateY(-1px);box-shadow:0 4px 12px rgba(37,99,235,.12)}
.welcome-bubbles button svg{width:14px;height:14px;color:#3b82f6;flex:none}
.welcome-composer{margin-top:20px;width:100%;max-width:680px}
.welcome-composer .composer{background:#fff;border:1px solid #e2e8f0;border-radius:14px;box-shadow:0 4px 20px rgba(15,23,42,.08);padding:10px 12px}
.welcome-composer .uc-input-row textarea{min-height:44px;max-height:120px}
/* 对话模式：消息区+输入框统一限宽居中对齐 */
.chat .msgs{max-width:1060px;margin:0 auto;width:100%;box-sizing:border-box}
.chat .uc-wrap{max-width:1060px;margin:0 auto;width:100%;box-sizing:border-box}
.msg{display:flex;gap:9px;margin-bottom:13px;opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s}
.msg.show{opacity:1;transform:none}
.m-avatar{width:28px;height:28px;flex:none;border-radius:9px;display:grid;place-items:center;overflow:hidden;font-size:10.5px;font-weight:700;color:#fff;background:var(--violet)}
.m-avatar.expert{background:#4a4a55}
.m-avatar img{width:100%;height:100%;display:block;object-fit:cover}
.m-avatar::before,.m-avatar::after{display:none!important}
.m-body{flex:1;min-width:0}
.m-meta{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.m-meta strong{font-size:11px}
.m-meta time{font-size:9px;color:#aaaab2}
.m-text{font-size:11.5px;line-height:1.7;color:#55555f;background:#fff;border:1px solid var(--line);border-radius:5px 10px 10px 10px;padding:10px 13px;white-space:pre-line}
.msg.user{justify-content:flex-end}
.msg.user .m-body{max-width:78%}
.msg.user .m-meta{justify-content:flex-end}
.msg.user .m-text{background:#2b2b35;color:#fff;border:0;border-radius:10px 5px 10px 10px}
.m-steps{border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px 16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.m-steps .wf-title{font-size:12px;color:#64748b;margin-bottom:8px;font-weight:500}
.m-steps .step-item{display:flex;align-items:center;gap:8px;font-size:12px;color:#94a3b8;opacity:0;transform:translateX(-4px);transition:.3s}
.m-steps .step-item.show{opacity:1;transform:none}
.m-steps .step-item.running{color:#2563eb;font-weight:500}
.m-steps .step-item.done{color:#16a34a;font-weight:500}
.m-steps .step-dot{width:18px;height:18px;border-radius:50%;border:2px solid #cbd5e1;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.m-steps .step-item.running .step-dot{border-color:#60a5fa}
.m-steps .step-item.done .step-dot{border:none;background:#22c55e}
@keyframes wf-spin{to{transform:rotate(360deg)}}
.m-steps .wf-spin{animation:wf-spin 2s linear infinite}
.wf-collapsed{display:flex;align-items:center;gap:6px;font-size:12px;color:#22c55e;font-weight:600;padding:2px 0}
.wf-collapsed svg{width:15px;height:15px}
.m-sys{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:10px;background:#fff}
.m-sys .sys-ico{width:26px;height:26px;flex:none;border-radius:8px;display:grid;place-items:center;font-size:12px;background:var(--gray-bg)}
.m-sys.ok .sys-ico{background:#e9f4ee}
.m-sys.warn .sys-ico{background:var(--yellow-bg)}
.m-sys.urgent{border-color:var(--red-line);background:#fffafa}
.m-sys.urgent .sys-ico{background:#f7d6d6}
.m-sys .sys-tx{min-width:0;flex:1}
.m-sys .sys-tx strong{font-size:11.5px;display:block;margin-bottom:2px}
.m-sys .sys-tx p{margin:0;font-size:10.5px;color:#6a6a73;line-height:1.55}
.m-sys time{flex:none;font-size:9px;color:var(--faint)}
.m-actions{display:flex;gap:8px;margin-top:10px;justify-content:flex-end}
.m-actions button{border-radius:7px;padding:7px 13px;font-size:11px;font-weight:650}
.m-actions .confirm{border:0;background:var(--violet);color:#fff}
.m-actions .confirm:hover{background:var(--violet-deep)}
.m-actions .adjust{border:1px solid var(--line);background:#fff;color:#656570}
.m-actions .link{border:0;background:none;color:var(--violet);padding:7px 2px}
.typing{display:inline-flex;gap:4px;padding:12px 14px;background:#f7f7f9;border-radius:5px 10px 10px 10px}
.typing i{width:6px;height:6px;border-radius:50%;background:#c4c4cc;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
.quick-caps{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 10px}
.quick-caps button{border:1px solid var(--violet-line);background:var(--violet-soft);color:var(--violet-deep);border-radius:999px;padding:7px 13px;font-size:11px}
.quick-caps button:hover{background:#e4ddff}
.composer{margin:0;border:1px solid #dadae2;border-radius:15px;padding:10px 11px 9px;background:#fff;box-shadow:0 8px 24px rgba(27,25,45,.10)}
.composer textarea{width:100%;height:58px;resize:none;border:0;outline:0;font-size:12px;line-height:1.65;background:none;color:var(--ink);font-family:inherit}
.composer textarea::placeholder{color:#9a9aa3}
.composer-bar{display:flex;align-items:center;gap:7px;margin-top:5px}

<script>
/* ================= 基础 ================= */
const HOUR_H=56, DAY_START=8*60, NOW_MIN=13*60+15;
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const fmt=m=>`${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}`;
let toastTimer=null;
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200);}

function renderTasks(){
  const timeline=$('timeline');
  if(!timeline)return; /* 首页已移除人物流区域，跳过 */
  /* 扁平时间流 = 张三个人视角 */
  const mine=TASKS.filter(t=>t.person==='yu').sort((a,b)=>a.s-b.s||a.e-b.e);
  if(!mine.length){timeline.innerHTML='<div class="empty-flow">今日暂无任务</div>';return;}

  const groups=[];
  for(const t of mine){
    let g=groups.find(x=>x.key===t.s);
    if(!g){g={key:t.s,tasks:[]};groups.push(g);}
    g.tasks.push(t);
  }

  const doneCount=mine.filter(t=>t.done).length;
  if($('doneCount')) $('doneCount').textContent=`${doneCount} 项已完成`;
  if($('pendingCount')) $('pendingCount').textContent=`${mine.length-doneCount} 项待处理`;

  const card=t=>{
    const missed=!t.done&&t.e<NOW_MIN;
    let chip='';
    if(t.done) chip='<span class="t-chip">✓ 已完成</span>';
    else if(missed) chip='<span class="t-chip">未完成</span>';
    else chip=`<span class="t-chip">${TYPE_NAME[t.type]}</span>`;
    const action=!t.done&&t.link?`onclick="location.href='${t.link}'"`:(!t.done&&(t.type==='must'||t.type==='optional')?`onclick="openTaskPop(event,TASKS.find(x=>x.id==='${t.id}'))"`:'');
    return `<div class="flow-task ${t.type}${t.done?' done':''}${missed?' missed':''}${!t.done&&t.link?' linked':''}" data-id="${t.id}" ${action}>
      <div class="flow-top"><div class="t-title">${t.title}</div>${chip}</div>
      <div class="flow-meta"><span>${fmt(t.s)} – ${fmt(t.e)}</span><i></i><span>${COL_NAME[t.col]}</span></div>
    </div>`;
  };
  const groupHtml=(g,current)=>{
    const now=g.key<=NOW_MIN&&Math.max(...g.tasks.map(t=>t.e))>=NOW_MIN;
    return `<div class="time-group${current||now?' current':''}"><div class="time-label">${fmt(g.key)}</div><div class="time-cards">${g.tasks.map(card).join('')}</div></div>`;
  };
  const nowRow='<div class="now-row"><span class="nw-t">13:15</span><span class="nw-l"></span></div>';

  /* 已完成且已过去的整组折叠；超时未做的保留彩色提醒 */
  const foldGroups=groups.filter(g=>Math.max(...g.tasks.map(t=>t.e))<NOW_MIN&&g.tasks.every(t=>t.done));
  const restGroups=groups.filter(g=>!foldGroups.includes(g));

  let html='';
  if(foldGroups.length){
    const n=foldGroups.reduce((a,g)=>a+g.tasks.length,0);
    html+=`<div class="fold-bar" onclick="toggleFold(this)">✓ 上午已完成 ${n} 项 · 点击<b>展开</b></div><div class="fold-body">${foldGroups.map(g=>groupHtml(g,false)).join('')}</div>`;
  }
  const upIdx=restGroups.findIndex(g=>g.key>=NOW_MIN);
  restGroups.forEach((g,i)=>{
    if(i===upIdx)html+=nowRow;
    html+=groupHtml(g,i===upIdx);
  });
  if(upIdx===-1)html+=nowRow;
  timeline.innerHTML=html;
}
function toggleFold(bar){
  const body=bar.nextElementSibling;body.classList.toggle('open');
  bar.querySelector('b').textContent=body.classList.contains('open')?'收起':'展开';
}

function flashTask(id){
  renderTasks();
  document.querySelector('.fold-body')?.classList.add('open');
  const el=document.querySelector(`.flow-task[data-id="${id}"]`);
  if(!el)return;
  el.scrollIntoView({block:'center',behavior:'smooth'});
  el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');
}

/* ================= 全景图（三列分列日历） ================= */
function y(m){return (m-DAY_START)/60*HOUR_H;}
function layoutCol(tasks){
  const sorted=[...tasks].sort((a,b)=>a.s-b.s||a.e-b.e);
  const clusters=[];let cur=[],curEnd=-1;
  for(const t of sorted){
    if(t.s>=curEnd){if(cur.length)clusters.push(cur);cur=[t];curEnd=t.e;}
    else{cur.push(t);curEnd=Math.max(curEnd,t.e);}
  }
  if(cur.length)clusters.push(cur);
  for(const cl of clusters){
    const laneEnds=[];
    for(const t of cl){
      let li=laneEnds.findIndex(e=>e<=t.s);
      if(li===-1){laneEnds.push(t.e);li=laneEnds.length-1;}else laneEnds[li]=t.e;
      t._lane=li;
    }
    for(const t of cl)t._lanes=laneEnds.length;
  }
  return sorted;
}
function renderPano(){
  const ax=$('panoAxis');ax.style.height=y(19*60)+'px';
  let ticks='';
  for(let h=8;h<=19;h++)ticks+=`<span class="tick" style="top:${y(h*60)}px">${h}:00</span>`;
  ax.innerHTML=ticks;
  $('panoNow').style.top=y(NOW_MIN)+'px';
  for(const col of ['content','lead','qa']){
    const el=document.querySelector(`.pano-body .col[data-col="${col}"]`);
    el.style.height=y(19*60)+'px';el.innerHTML='';
    for(const t of layoutCol(TASKS.filter(x=>x.col===col))){
      const missed=!t.done&&t.e<NOW_MIN;
      const d=document.createElement('div');
      d.className=`task ${t.type}${t.done?' done':''}${missed?' missed':''}`;
      const w=100/t._lanes;
      d.style.left=`calc(${t._lane*w}% + 2px)`;
      d.style.width=`calc(${w}% - 6px)`;
      d.style.top=y(t.s)+'px';
      d.style.height=Math.max(y(t.e)-y(t.s)-4,36)+'px';
      let chip='';
      if(t.done)chip='<span class="t-chip">✓</span>';
      else if(missed)chip='<span class="t-chip">未做</span>';
      else if(t.type!=='routine')chip=`<span class="t-chip">${TYPE_NAME[t.type]}</span>`;
      d.innerHTML=`<div class="t-title">${t.title}</div><div class="t-time">${fmt(t.s)} – ${fmt(t.e)}</div>`+chip;
      if(!t.done&&(t.type==='must'||t.type==='optional'))d.onclick=ev=>openTaskPop(ev,t);
      el.appendChild(d);
    }
  }
}
function openPano(){renderPano();$('panoOverlay').classList.add('show');}
function closePano(){$('panoOverlay').classList.remove('show');}

    <div class="pop-rows">
      <div class="pop-row"><b>背景</b><span>${t.info.bg}</span></div>
      <div class="pop-row"><b>需要你做</b><span>${t.info.need}</span></div>
      <div class="pop-row"><b>AI 已做</b><span>${t.info.ai}</span></div>
    </div>`;
  pop.classList.add('show');
  const pw=296,ph=210;
  let x=ev.clientX+12,y2=ev.clientY+12;
  if(x+pw>innerWidth-12)x=ev.clientX-pw-12;
  if(y2+ph>innerHeight-12)y2=innerHeight-ph-12;
  pop.style.left=x+'px';pop.style.top=y2+'px';
}

function asDragStart(ev,id){dragId=id;ev.dataTransfer.effectAllowed='move';}
function asDragOver(ev,col){
  ev.preventDefault();
  if(col.dataset.p==='cui'){ev.dataTransfer.dropEffect='none';col.classList.add('no');col.classList.remove('over');}
  else{ev.dataTransfer.dropEffect='move';col.classList.add('over');col.classList.remove('no');}
}
function asDrop(ev,col){
  ev.preventDefault();col.classList.remove('over','no');
  const p=col.dataset.p;
  if(p==='cui'){toast('王五请假中，任务请改派给其他同事');return;}

  if(!t||t.person===p)return;
  t.person=p;renderAssign();renderTasks();
  toast(`已改派给${PEOPLE[p]}，背景与话术已同步交接`);
}

/* ================= 全局搜索 ================= */
const appsIndex=[
  {key:'leban',name:'乐伴'},
  {key:'liata',name:'聊TA'},
  {key:'tec',name:'TEC'},
  {key:'ledo',name:'乐道'},
  {key:'taiwei',name:'泰为'}
];
const workflowSteps=[
  {name:'工作日历',sub:'当日任务全景图',action:'openPano()'},
  {name:'任务分配',sub:'拖拽改派',action:'openAssign()'},
  {name:'定时任务',sub:'运行中定时 SOP',action:'toggleSched()'}
];
let _msgIdx=null;
function buildMessageIndex(){
  const idx=[];
  document.querySelectorAll('.mcn-nav-item').forEach(btn=>{
    const label=btn.querySelector('.mcn-nav-label');
    const oc=btn.getAttribute('onclick')||'';
    const m=oc.match(/location\.href='([^']+)'/);
    if(label&&m) idx.push({key:m[1],name:label.textContent.trim(),sub:'导航',href:m[1]});
  });
  SESSIONS.forEach(s=>idx.push({key:s.id,name:s.name,sub:s.sub||'',session:s.id}));
  TASKS.filter(t=>t.link).forEach(t=>idx.push({key:t.id,name:t.title,sub:`${fmt(t.s)}-${fmt(t.e)} · 任务`,task:t.id}));
  return idx;
}
function fuzzy(q,text){
  if(!q||text==null) return false;
  const Q=String(q).toLowerCase(),T=String(text).toLowerCase();
  if(T.includes(Q)) return true;
  let ti=0;
  for(let i=0;i<Q.length;i++){
    const idx=T.indexOf(Q[i],ti);
    if(idx===-1) return false;
    ti=idx+1;
  }
  return true;
}
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function hideSearchResults(){
  const w=$('searchResults');if(w){w.classList.add('hidden');w.innerHTML='';}
  const c=$('searchClear');if(c)c.classList.add('hidden');
}
function renderSearchResults(q){
  const wrap=$('searchResults'),clear=$('searchClear');
  if(!wrap) return;
  clear.classList.toggle('hidden',!q);
  if(!q){wrap.classList.add('hidden');wrap.innerHTML='';return;}
  if(!_msgIdx) _msgIdx=buildMessageIndex();
  const msgHits=_msgIdx.filter(it=>fuzzy(q,it.name)||fuzzy(q,it.sub));
  const wfHits=workflowSteps.filter(w=>fuzzy(q,w.name)||fuzzy(q,w.sub));
  const appHits=appsIndex.filter(a=>fuzzy(q,a.name));
  if(!msgHits.length&&!wfHits.length&&!appHits.length){
    wrap.innerHTML=`<div class="search-empty">未找到与 “${escapeHtml(q)}” 相关的结果</div>`;
    wrap.classList.remove('hidden');
    return;
  }
  const section=(title,items,icon,onClick)=>{
    if(!items.length) return '';
    return `<div class="search-sec">${title}</div>`+
      items.map(it=>`<div class="search-item" onclick="${onClick(it)};hideSearchResults();">
        <span class="search-ico">${icon}</span>
        <div style="min-width:0;flex:1">
          <div class="t">${escapeHtml(it.name)}</div>
          <div class="s">${escapeHtml(it.sub||'')}</div>
        </div>
      </div>`).join('');
  };
  const msgIcon='<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-5l-5 5v-5z"/></svg>';
  const wfIcon='<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 0 0 4.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 0 1-15.357-2m15.357 2H15"/></svg>';
  const appIcon='<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6zM14 6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2V6zM4 16a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2zM14 16a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2v-2z"/></svg>';
  let html='';
  html+=section('消息',msgHits,msgIcon,it=>it.href?`location.href='${it.href}'`:it.session?`openSession('${it.session}')`:`toast('任务：${escapeHtml(it.name)}')`);
  html+=section('工作流',wfHits,wfIcon,it=>`try{${it.action}}catch(_){}`);
  html+=section('应用',appHits,appIcon,it=>`toast('打开应用：${escapeHtml(it.name)}')`);
  wrap.innerHTML=html;
  wrap.classList.remove('hidden');
}

function updateCalDate(){
  const el=$('calDate');
  if(!el) return;
  const d=new Date();
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const day=String(d.getDate()).padStart(2,'0');
  const wd=['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  const h=String(d.getHours()).padStart(2,'0');
  const min=String(d.getMinutes()).padStart(2,'0');
  el.textContent=`${y}/${m}/${day}  ${wd}  ${h}:${min}`;
}
